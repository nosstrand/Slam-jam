<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090e"><title>Slam Jam</title><style>:root{--bg:#09090e;--panel:#15151e;--muted:#9999aa;--green:#1ed760;--r:#ff5060;--y:#ffd54a;--b:#56d6ff;--g:#73df6b}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}button,input,select{font:inherit}#app{height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;position:relative}.zone{display:flex;align-items:center;justify-content:center;border:1px solid #292932;font-size:clamp(23px,6vw,43px);font-weight:1000;user-select:none}.zone small{display:block;font-size:11px;letter-spacing:.12em;text-align:center;margin-top:5px}.z1{background:#42151c;color:var(--r)}.z2{background:#423612;color:var(--y)}.z3{background:#123946;color:var(--b)}.z4{background:#173b18;color:var(--g)}.winner{filter:brightness(1.9);box-shadow:inset 0 0 0 7px currentColor;z-index:3}.dim{opacity:.28}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;width:min(84vw,470px);max-height:86vh;overflow:auto;background:#15151ef5;border:1px solid #3a3a46;border-radius:27px;padding:17px;text-align:center;box-shadow:0 24px 90px #000}.logo{font-size:43px;font-weight:1000;letter-spacing:-3px;line-height:.9}.tag,.tiny{font-size:11px;color:var(--muted)}.status{font-size:17px;font-weight:900;margin:12px 0 7px}.heard{font-size:12px;color:#c2c2cf;min-height:19px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.btn{border:0;border-radius:14px;padding:11px 9px;font-weight:900;background:#fff;color:#101016}.secondary{background:#292934;color:#fff}.spotify{background:var(--green);color:#06150b}.full{grid-column:1/-1}.setup{display:none;border-top:1px solid #30303a;margin-top:10px;padding-top:10px}.setup.show{display:block}.setup input,.setup select{width:100%;margin:4px 0;padding:10px;border-radius:12px;border:1px solid #393945;background:#22222c;color:#fff}.playlists{display:none}.playlists.show{display:block}.reveal{display:none;margin-top:10px;padding:10px;border-radius:15px;background:#22222d}.reveal.show{display:block}.answerTitle{font-size:20px;font-weight:1000}.answerMeta{font-size:13px;color:#c5c5cf}.score{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.score button{border:0;border-radius:11px;background:#30303b;color:#fff;padding:9px 5px;font-weight:900}.score button.active{background:#54d681;color:#07150d}@media(max-height:650px){.center{max-height:92vh;padding:12px}.logo{font-size:34px}.status{margin:8px 0}}</style></head><body><div id="app"><div class="zone z1" data-p="1"><div>PLAYER 1<small>TOMATO</small></div></div><div class="zone z2" data-p="2"><div>PLAYER 2<small>FROG</small></div></div><div class="zone z4" data-p="4"><div>PLAYER 4<small>STONE</small></div></div><div class="zone z3" data-p="3"><div>PLAYER 3<small>CYCLE</small></div></div><main class="center"><div class="logo">SLAM JAM</div><div class="tag">Hear it. Say it. Name it.</div><div id="status" class="status">Connect Spotify to begin.</div><div id="heard" class="heard">Tomato · Frog · Cycle · Stone</div><div class="buttons"><button id="mic" class="btn secondary">Enable Mic</button><button id="start" class="btn" disabled>Start Round</button><button id="reveal" class="btn secondary" disabled>Reveal</button><button id="next" class="btn secondary" disabled>Next Song</button><button id="spotifyBtn" class="btn spotify full">Connect Spotify</button></div><section id="setup" class="setup"><input id="clientId" placeholder="Spotify Client ID" autocomplete="off"><button id="auth" class="btn spotify" style="width:100%;margin-top:4px">Authorize Spotify</button><div id="redirect" class="tiny" style="margin-top:6px"></div></section><section id="playlists" class="setup playlists"><select id="source"><option value="liked">Liked Songs</option></select><button id="load" class="btn secondary" style="width:100%;margin-top:4px">Use this music</button></section><section id="revealBox" class="reveal"><div id="ansTitle" class="answerTitle"></div><div id="ansArtist" class="answerMeta"></div><div id="ansYear" class="answerMeta"></div><div class="score"><button data-score="artist">Artist +1</button><button data-score="title">Title +1</button><button data-score="year">Year +1</button></div><div id="roundPts" class="tiny" style="margin-top:6px">Round points: 0</div></section><div class="tiny" style="margin-top:9px">Spotify Premium required for in-browser playback. Touch a player quadrant is the fallback buzzer.</div></main></div><script src="https://sdk.scdn.co/spotify-player.js"></script><script>(()=>{const $=id=>document.getElementById(id),zones=[...document.querySelectorAll('.zone')],words={tomato:1,frog:2,cycle:3,stone:4},alias={tomatoes:'tomato',frogs:'frog',bicycle:'cycle',cycling:'cycle',stones:'stone'};let token=null,refreshToken=null,expiresAt=0,player=null,deviceId=null,tracks=[],current=null,startedAt=0,locked=false,listening=false,rec=null,score=new Set();const redirectUri='https://slam-jam-obh1.vercel.app/';$('redirect').textContent='Spotify Redirect URI: '+redirectUri;function msg(s,h){$('status').textContent=s;if(h!==undefined)$('heard').textContent=h}function clearZones(){zones.forEach(z=>z.classList.remove('winner','dim'))}function lockPlayer(p,word='TOUCH'){if(locked||!current)return;locked=true;if(player)player.pause();zones.forEach(z=>{const hit=+z.dataset.p===p;z.classList.toggle('winner',hit);z.classList.toggle('dim',!hit)});const rt=startedAt?((performance.now()-startedAt)/1000).toFixed(2):'?';msg('PLAYER '+p+' BUZZED!',word.toUpperCase()+' · '+rt+' sec');$('reveal').disabled=false;navigator.vibrate?.([50,30,80])}zones.forEach(z=>z.onpointerdown=()=>lockPlayer(+z.dataset.p));function detect(t){for(let w of t.toLowerCase().replace(/[^a-z ]/g,' ').split(/\s+/)){w=alias[w]||w;if(words[w])return{w,p:words[w]}}return null}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-US';rec.onstart=()=>{listening=true;$('mic').textContent='Mic Listening ✓'};rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)for(let j=0;j<e.results[i].length;j++){const t=e.results[i][j].transcript||'',d=detect(t);if(d&&!locked&&current){$('heard').textContent='Heard: '+t;return lockPlayer(d.p,d.w)}}};rec.onend=()=>{if(listening)try{rec.start()}catch{}};$('mic').onclick=()=>{if(!listening){listening=true;try{rec.start()}catch{}}else{listening=false;rec.stop();$('mic').textContent='Enable Mic'}}}else{$('mic').disabled=true;$('mic').textContent='Speech unavailable'}$('spotifyBtn').onclick=()=>{$('setup').classList.toggle('show');$('clientId').value=localStorage.sjClientId||''};function rand(n=64){const a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(x=>'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'[x%62]).join('')}async function sha(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s))}function b64(b){return btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function saveTokens(d){token=d.access_token;refreshToken=d.refresh_token||refreshToken;expiresAt=Date.now()+(d.expires_in||3600)*1000-60000;localStorage.sjToken=token;localStorage.sjRefresh=refreshToken||'';localStorage.sjExpiry=String(expiresAt)}async function getToken(){if(token&&Date.now()<expiresAt)return token;if(!refreshToken)return token;const clientId=localStorage.sjClientId;const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:clientId,grant_type:'refresh_token',refresh_token:refreshToken})});const d=await r.json();if(r.ok){saveTokens(d);return token}throw new Error('Spotify token refresh failed')}$('auth').onclick=async()=>{const id=$('clientId').value.trim();if(!id)return alert('Paste your Spotify Client ID.');localStorage.sjClientId=id;const verifier=rand();localStorage.sjVerifier=verifier;const challenge=b64(await sha(verifier));const state=rand(20);localStorage.sjState=state;const u=new URL('https://accounts.spotify.com/authorize');u.search=new URLSearchParams({client_id:id,response_type:'code',redirect_uri:redirectUri,code_challenge_method:'S256',code_challenge:challenge,state,scope:'streaming user-read-private user-read-email user-modify-playback-state user-read-playback-state playlist-read-private playlist-read-collaborative user-library-read'});location.href=u};async function callback(){const q=new URLSearchParams(location.search),code=q.get('code');if(!code)return;try{if(q.get('state')!==localStorage.sjState)throw new Error('Spotify state mismatch');const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:localStorage.sjClientId,grant_type:'authorization_code',code,redirect_uri:redirectUri,code_verifier:localStorage.sjVerifier})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.error);saveTokens(d);history.replaceState({},'',redirectUri);msg('Spotify connected ✓','Loading your playlists…');await loadSources();initPlayer()}catch(e){msg('Spotify login failed',e.message)}}async function api(path,opt={}){const t=await getToken();const r=await fetch('https://api.spotify.com/v1'+path,{...opt,headers:{Authorization:'Bearer '+t,'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok){const tx=await r.text();throw new Error('Spotify '+r.status+': '+tx)}return r.status===204?null:r.json()}async function loadSources(){const d=await api('/me/playlists?limit=50');$('source').innerHTML='<option value="liked">Liked Songs</option>';for(const p of d.items||[]){const o=document.createElement('option');o.value='playlist:'+p.id;o.textContent=p.name;$('source').appendChild(o)}$('playlists').classList.add('show');msg('Spotify connected ✓','Choose a playlist or Liked Songs.')}async function loadTracks(){msg('Loading songs…');const v=$('source').value;let url=v==='liked'?'/me/tracks?limit=50':'/playlists/'+v.split(':')[1]+'/items?limit=50';try{const d=await api(url);tracks=(d.items||[]).map(x=>x.track||x.item).filter(x=>x&&x.uri&&x.type==='track');if(!tracks.length)throw new Error('No playable tracks returned.');$('start').disabled=false;$('next').disabled=false;msg(tracks.length+' songs ready','Press Start Round.')}catch(e){msg('Could not load that playlist',e.message+' Try Liked Songs or a playlist you own.')}}$('load').onclick=loadTracks;window.onSpotifyWebPlaybackSDKReady=()=>{if(token)initPlayer()};async function initPlayer(){if(!window.Spotify||player)return;player=new Spotify.Player({name:'Slam Jam',getOAuthToken:async cb=>cb(await getToken()),volume:.8});player.addListener('ready',({device_id})=>{deviceId=device_id;msg('Spotify player ready ✓','Choose music, then Start Round.');$('playlists').classList.add('show')});player.addListener('not_ready',()=>{deviceId=null});player.addListener('initialization_error',e=>msg('Spotify player error',e.message));player.addListener('authentication_error',e=>msg('Spotify auth error',e.message));player.addListener('account_error',e=>msg('Spotify Premium required',e.message));player.addListener('playback_error',e=>msg('Playback error',e.message));player.addListener('autoplay_failed',()=>msg('Tap Start Round again','iPhone blocked autoplay.'));await player.connect()}async function startRound(){if(!tracks.length)return msg('Choose music first.');if(!player||!deviceId)return msg('Spotify player not ready yet.');try{await player.activateElement();clearZones();locked=false;score.clear();document.querySelectorAll('[data-score]').forEach(b=>b.classList.remove('active'));$('roundPts').textContent='Round points: 0';$('revealBox').classList.remove('show');$('reveal').disabled=true;current=tracks[Math.floor(Math.random()*tracks.length)];await api('/me/player/play?device_id='+encodeURIComponent(deviceId),{method:'PUT',body:JSON.stringify({uris:[current.uri],position_ms:0})});startedAt=performance.now();msg('SONG PLAYING — BUZZ!','Say Tomato · Frog · Cycle · Stone')}catch(e){msg('Could not start Spotify',e.message)}}$('start').onclick=startRound;$('next').onclick=startRound;$('reveal').onclick=()=>{if(!current)return;$('revealBox').classList.add('show');$('ansTitle').textContent=current.name;$('ansArtist').textContent=(current.artists||[]).map(a=>a.name).join(', ');$('ansYear').textContent='Year: '+((current.album&&current.album.release_date)||'').slice(0,4)};document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>{const k=b.dataset.score;score.has(k)?score.delete(k):score.add(k);b.classList.toggle('active',score.has(k));$('roundPts').textContent='Round points: '+score.size});token=localStorage.sjToken||null;refreshToken=localStorage.sjRefresh||null;expiresAt=+localStorage.sjExpiry||0;if(token){msg('Reconnecting Spotify…');loadSources().catch(()=>{});if(window.Spotify)initPlayer()}callback()})();</script></body></html>
