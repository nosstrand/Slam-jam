<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Slam Jam</title><style>html,body{height:100%;margin:0;background:#0a0a0f;color:#fff;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}#app{height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;position:relative}.p{display:flex;align-items:center;justify-content:center;font-weight:900;font-size:7vw;border:1px solid #333;user-select:none}.p small{display:block;font-size:12px;text-align:center}.a{background:#42151c;color:#ff5a69}.b{background:#403511;color:#ffd54a}.c{background:#103745;color:#5ad7ff}.d{background:#163b16;color:#75e06b}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76%;max-width:430px;background:#15151df5;border:1px solid #444;border-radius:26px;padding:18px;text-align:center;box-shadow:0 20px 70px #000}.logo{font-size:42px;font-weight:1000;letter-spacing:-3px}.sub{color:#aaa;font-size:12px}.status{font-size:17px;font-weight:800;margin:14px 0}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}button,input{font:inherit}button{border:0;border-radius:14px;padding:12px;font-weight:800}.spotify{background:#1ed760;color:#07150b;grid-column:1/-1}.file{width:100%;margin-top:8px;color:#aaa}.winner{filter:brightness(2);box-shadow:inset 0 0 0 7px currentColor}.dim{opacity:.3}</style></head><body><div id="app"><div class="p a" data-player="1"><div>PLAYER 1<small>TOMATO</small></div></div><div class="p b" data-player="2"><div>PLAYER 2<small>FROG</small></div></div><div class="p d" data-player="4"><div>PLAYER 4<small>STONE</small></div></div><div class="p c" data-player="3"><div>PLAYER 3<small>CYCLE</small></div></div><div class="center"><div class="logo">SLAM JAM</div><div class="sub">Hear it. Say it. Name it.</div><div class="status" id="status">Enable mic, load a song, then play.</div><div class="buttons"><button id="mic">Enable Mic</button><button id="play">Play Song</button><button id="reset">Reset</button><button id="resume">Resume</button><button class="spotify" id="spotify">Spotify Setup</button></div><input class="file" id="file" type="file" accept="audio/*"><div id="heard" class="sub" style="margin-top:9px">Tomato · Frog · Cycle · Stone</div></div></div><audio id="audio"></audio><script>const words={tomato:1,frog:2,cycle:3,stone:4},aliases={tomatoes:'tomato',frogs:'frog',bicycle:'cycle',cycling:'cycle',stones:'stone'},zones=[...document.querySelectorAll('.p')],audio=document.getElementById('audio'),status=document.getElementById('status'),heard=document.getElementById('heard');let rec,listening=false,locked=false,start=0;function hit(player,word='touch'){if(locked||audio.paused)return;locked=true;audio.pause();zones.forEach(z=>{let same=+z.dataset.player===player;z.classList.toggle('winner',same);z.classList.toggle('dim',!same)});status.textContent='PLAYER '+player+' BUZZED!';heard.textContent=word.toUpperCase()+' · '+((performance.now()-start)/1000).toFixed(2)+' sec';navigator.vibrate?.([50,30,80])}zones.forEach(z=>z.onpointerdown=()=>hit(+z.dataset.player));document.getElementById('file').onchange=e=>{let f=e.target.files[0];if(f){audio.src=URL.createObjectURL(f);status.textContent='Loaded: '+f.name}};document.getElementById('play').onclick=async()=>{if(!audio.src)return status.textContent='Choose an audio file first.';locked=false;zones.forEach(z=>z.classList.remove('winner','dim'));audio.currentTime=0;await audio.play();start=performance.now();status.textContent='SONG PLAYING — SAY YOUR WORD!'};document.getElementById('resume').onclick=async()=>{locked=false;zones.forEach(z=>z.classList.remove('winner','dim'));await audio.play();start=performance.now();status.textContent='SONG RESUMED'};document.getElementById('reset').onclick=()=>{audio.pause();if(audio.src)audio.currentTime=0;locked=false;zones.forEach(z=>z.classList.remove('winner','dim'));status.textContent='Ready';heard.textContent='Tomato · Frog · Cycle · Stone'};const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-US';rec.onstart=()=>{listening=true;document.getElementById('mic').textContent='Mic Listening ✓'};rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)for(let j=0;j<e.results[i].length;j++){let t=e.results[i][j].transcript.toLowerCase(),tokens=t.replace(/[^a-z ]/g,' ').split(/\s+/);for(let token of tokens){token=aliases[token]||token;if(words[token]&&!locked&&!audio.paused)return hit(words[token],token)}}};rec.onend=()=>{if(listening)try{rec.start()}catch{}};document.getElementById('mic').onclick=()=>{if(!listening){listening=true;try{rec.start()}catch{}}else{listening=false;rec.stop();document.getElementById('mic').textContent='Enable Mic'}}}else{document.getElementById('mic').textContent='Speech unsupported';document.getElementById('mic').disabled=true}document.getElementById('spotify').onclick=()=>alert('Spotify connection will be enabled after deployment so the final HTTPS URL can be registered as the Spotify OAuth redirect URI.');</script></body></html>
