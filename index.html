<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090e"><title>Slam Jam</title><style>:root{--bg:#09090e;--muted:#9b9bab;--r:#ff5060;--y:#ffd54a;--b:#56d6ff;--g:#73df6b;--ok:#52d47f;--err:#ff6b78}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}button,input{font:inherit}#app{height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;position:relative}.zone{display:flex;align-items:center;justify-content:center;border:1px solid #292932;font-weight:1000;font-size:clamp(22px,6vw,42px);user-select:none}.zone small{display:block;text-align:center;font-size:11px;letter-spacing:.12em;margin-top:5px}.z1{background:#42151c;color:var(--r)}.z2{background:#423612;color:var(--y)}.z3{background:#123946;color:var(--b)}.z4{background:#173b18;color:var(--g)}.winner{filter:brightness(1.9);box-shadow:inset 0 0 0 7px currentColor;z-index:3}.dim{opacity:.28}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;width:min(84vw,470px);max-height:88vh;overflow:auto;background:#15151ef5;border:1px solid #3a3a46;border-radius:27px;padding:17px;text-align:center;box-shadow:0 24px 90px #000}.logo{font-size:44px;font-weight:1000;letter-spacing:-3px;line-height:.9}.tag,.tiny{font-size:11px;color:var(--muted)}.status{font-size:17px;font-weight:900;margin:12px 0 7px}.heard{font-size:12px;color:#c8c8d1;min-height:19px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.btn{border:0;border-radius:14px;padding:11px 9px;font-weight:900;background:#fff;color:#111}.btn:disabled{opacity:.35}.secondary{background:#292934;color:#fff}.picker{display:block;width:100%;margin-top:9px;padding:10px;border-radius:12px;background:#22222c;color:#ddd;border:1px solid #393945}.reveal{display:none;margin-top:10px;padding:10px;border-radius:15px;background:#22222d}.reveal.show{display:block}.score{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.score button{border:0;border-radius:11px;background:#30303b;color:#fff;padding:9px 5px;font-weight:900}.score button.active{background:var(--ok);color:#07150d}.meta{width:100%;margin-top:6px;padding:9px;border-radius:11px;background:#20202a;border:1px solid #363641;color:#fff}.error{color:var(--err)!important}</style></head><body><div id="app"><div class="zone z1" data-p="1"><div>PLAYER 1<small>TOMATO</small></div></div><div class="zone z2" data-p="2"><div>PLAYER 2<small>FROG</small></div></div><div class="zone z4" data-p="4"><div>PLAYER 4<small>STONE</small></div></div><div class="zone z3" data-p="3"><div>PLAYER 3<small>CYCLE</small></div></div><main class="center"><div class="logo">SLAM JAM</div><div class="tag">Hear it. Say it. Name it.</div><div id="status" class="status">Choose a local song to begin.</div><div id="heard" class="heard">MP3 · M4A · WAV · AAC supported</div><input id="file" class="picker" type="file" accept="audio/mpeg,audio/mp3,audio/mp4,audio/x-m4a,audio/wav,audio/x-wav,audio/aac,.mp3,.m4a,.wav,.aac"><input id="artist" class="meta" placeholder="Artist (optional, hidden during round)"><input id="title" class="meta" placeholder="Title (optional, hidden during round)"><input id="year" class="meta" placeholder="Year (optional, hidden during round)" inputmode="numeric"><div class="buttons"><button id="mic" class="btn secondary">Enable Mic</button><button id="start" class="btn" disabled>Start Round</button><button id="reveal" class="btn secondary" disabled>Reveal</button><button id="reset" class="btn secondary">Reset</button></div><section id="revealBox" class="reveal"><div id="ansTitle" style="font-size:20px;font-weight:1000"></div><div id="ansArtist" style="font-size:13px;color:#c5c5cf"></div><div id="ansYear" style="font-size:13px;color:#c5c5cf"></div><div class="score"><button data-score="artist">Artist +1</button><button data-score="title">Title +1</button><button data-score="year">Year +1</button></div><div id="roundPts" class="tiny" style="margin-top:6px">Round points: 0</div></section><div class="tiny" style="margin-top:9px">Local-song test mode. If voice misses, tap a player quadrant.</div></main></div><audio id="audio" preload="metadata" playsinline></audio><script>(()=>{const $=id=>document.getElementById(id),zones=[...document.querySelectorAll('.zone')],audio=$('audio'),words={tomato:1,frog:2,cycle:3,stone:4},aliases={tomatoes:'tomato',frogs:'frog',bicycle:'cycle',cycling:'cycle',stones:'stone'};let rec,listening=false,locked=false,started=0,loaded=false,points=new Set(),filename='',objectUrl=null;function msg(s,h,isErr=false){$('status').textContent=s;$('status').classList.toggle('error',isErr);if(h!==undefined)$('heard').textContent=h}function clearZones(){zones.forEach(z=>z.classList.remove('winner','dim'))}function hideMeta(hide=true){['artist','title','year','file'].forEach(id=>$(id).style.display=hide?'none':'block')}function humanDuration(sec){if(!Number.isFinite(sec))return'';const m=Math.floor(sec/60),s=Math.round(sec%60).toString().padStart(2,'0');return m+':'+s}function buzz(p,word='touch'){if(locked||audio.paused)return;locked=true;audio.pause();zones.forEach(z=>{const hit=+z.dataset.p===p;z.classList.toggle('winner',hit);z.classList.toggle('dim',!hit)});const rt=((performance.now()-started)/1000).toFixed(2);msg('PLAYER '+p+' BUZZED!',word.toUpperCase()+' · '+rt+' sec');$('reveal').disabled=false;navigator.vibrate?.([50,30,80])}zones.forEach(z=>z.onpointerdown=()=>buzz(+z.dataset.p));
$('file').addEventListener('change',e=>{const f=e.target.files?.[0];loaded=false;$('start').disabled=true;$('status').classList.remove('error');if(!f)return msg('Choose a local song to begin.','MP3 · M4A · WAV · AAC supported');filename=f.name;msg('Loading '+f.name+'…',(f.type||'audio file')+' · '+(f.size/1024/1024).toFixed(1)+' MB');if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);audio.pause();audio.removeAttribute('src');audio.load();audio.src=objectUrl;audio.load();const onReady=()=>{cleanup();loaded=true;$('start').disabled=false;msg(filename+' loaded ✓',(audio.duration?humanDuration(audio.duration)+' · ':'')+'Press Start Round.');};const onErr=()=>{cleanup();const code=audio.error?.code||'unknown';msg('Could not load this audio file','Audio error code: '+code+'. Try re-downloading the file or sharing it to Files first.',true);};function cleanup(){audio.removeEventListener('loadedmetadata',onReady);audio.removeEventListener('canplay',onReady);audio.removeEventListener('error',onErr)}audio.addEventListener('loadedmetadata',onReady,{once:true});audio.addEventListener('canplay',onReady,{once:true});audio.addEventListener('error',onErr,{once:true});setTimeout(()=>{if(!loaded&&audio.readyState>=1)onReady();},1800);});
$('start').onclick=async()=>{if(!loaded)return msg('Song is not ready yet.','Wait for “loaded ✓” before starting.',true);locked=false;clearZones();points.clear();document.querySelectorAll('[data-score]').forEach(b=>b.classList.remove('active'));$('roundPts').textContent='Round points: 0';$('revealBox').classList.remove('show');$('reveal').disabled=true;hideMeta(true);try{audio.currentTime=0;audio.muted=false;audio.volume=1;await audio.play();started=performance.now();msg('SONG PLAYING — BUZZ!','Say Tomato · Frog · Cycle · Stone')}catch(e){hideMeta(false);msg('Audio did not start',((e&&e.name)?e.name+': ':'')+(e&&e.message?e.message:'Tap Start Round again.'),true)}};$('reset').onclick=()=>{audio.pause();if(loaded)try{audio.currentTime=0}catch{}locked=false;clearZones();$('revealBox').classList.remove('show');$('reveal').disabled=true;hideMeta(false);msg(loaded?filename+' ready':'Choose a local song to begin.',loaded?'Press Start Round.':'MP3 · M4A · WAV · AAC supported')};$('reveal').onclick=()=>{$('revealBox').classList.add('show');$('ansTitle').textContent=$('title').value.trim()||filename.replace(/\.[^.]+$/,'');$('ansArtist').textContent=$('artist').value.trim()||'Artist: not entered';$('ansYear').textContent=$('year').value.trim()?'Year: '+$('year').value.trim():'Year: not entered'};document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>{const k=b.dataset.score;points.has(k)?points.delete(k):points.add(k);b.classList.toggle('active',points.has(k));$('roundPts').textContent='Round points: '+points.size});function detect(t){for(let w of t.toLowerCase().replace(/[^a-z ]/g,' ').split(/\s+/)){w=aliases[w]||w;if(words[w])return{w,p:words[w]}}return null}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-US';rec.onstart=()=>{listening=true;$('mic').textContent='Mic Listening ✓';msg(loaded?'Mic ready — start the song.':'Mic ready — choose a song.')} ;rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)for(let j=0;j<e.results[i].length;j++){const t=e.results[i][j].transcript||'',d=detect(t);if(d&&!locked&&!audio.paused){$('heard').textContent='Heard: '+t;return buzz(d.p,d.w)}}};rec.onerror=e=>msg('Microphone issue',e.error||'Speech recognition error',true);rec.onend=()=>{if(listening)try{rec.start()}catch{}};$('mic').onclick=()=>{if(!listening){listening=true;try{rec.start()}catch(e){msg('Could not start microphone',e.message||'Try again.',true)}}else{listening=false;rec.stop();$('mic').textContent='Enable Mic'}}}else{$('mic').disabled=true;$('mic').textContent='Speech unavailable';msg('Voice recognition unavailable','Touch the player quadrants to test buzzing.')}})();</script></body></html>
