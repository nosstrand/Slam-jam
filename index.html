<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090e"><title>Slam Jam</title><style>:root{--bg:#09090e;--muted:#9b9bab;--r:#ff5060;--y:#ffd54a;--b:#56d6ff;--g:#73df6b;--ok:#52d47f;--err:#ff6b78}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}button,input{font:inherit}#app{height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;position:relative}.zone{display:flex;align-items:center;justify-content:center;border:1px solid #292932;font-weight:1000;font-size:clamp(22px,6vw,42px);user-select:none}.zone small{display:block;text-align:center;font-size:11px;letter-spacing:.12em;margin-top:5px}.z1{background:#42151c;color:var(--r)}.z2{background:#423612;color:var(--y)}.z3{background:#123946;color:var(--b)}.z4{background:#173b18;color:var(--g)}.winner{filter:brightness(1.9);box-shadow:inset 0 0 0 7px currentColor;z-index:3}.dim{opacity:.28}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;width:min(86vw,470px);max-height:90vh;overflow:auto;background:#15151ef5;border:1px solid #3a3a46;border-radius:27px;padding:16px;text-align:center;box-shadow:0 24px 90px #000}.logo{font-size:44px;font-weight:1000;letter-spacing:-3px;line-height:.9}.tag,.tiny{font-size:11px;color:var(--muted)}.status{font-size:18px;font-weight:1000;margin:12px 0 7px}.heard{font-size:12px;color:#c8c8d1;min-height:19px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.btn{border:0;border-radius:14px;padding:11px 8px;font-weight:900;background:#fff;color:#111}.btn:disabled{opacity:.35}.secondary{background:#292934;color:#fff}.picker,.meta{display:block;width:100%;margin-top:7px;padding:9px;border-radius:11px;background:#20202a;border:1px solid #363641;color:#fff}.reveal{display:none;margin-top:10px;padding:10px;border-radius:15px;background:#22222d}.reveal.show{display:block}.score{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.score button{border:0;border-radius:11px;background:#30303b;color:#fff;padding:9px 5px;font-weight:900}.score button.active{background:var(--ok);color:#07150d}.error{color:var(--err)!important}.slam{animation:slam .25s ease-out}@keyframes slam{0%{transform:translate(-50%,-50%) scale(1)}45%{transform:translate(-50%,-50%) scale(1.06)}100%{transform:translate(-50%,-50%) scale(1)}}.claim{font-size:27px!important;color:#fff}</style></head><body><div id="app"><div class="zone z1" data-p="1"><div>PLAYER 1<small>PICKLE</small></div></div><div class="zone z2" data-p="2"><div>PLAYER 2<small>ROCKET</small></div></div><div class="zone z4" data-p="4"><div>PLAYER 4<small>VOLCANO</small></div></div><div class="zone z3" data-p="3"><div>PLAYER 3<small>PENGUIN</small></div></div><main class="center" id="panel"><div class="logo">SLAM JAM</div><div class="tag">SLAM IT. SHOUT IT. NAME IT.</div><div id="status" class="status">Choose a local song to begin.</div><div id="heard" class="heard">SLAM stops the song · your battle word claims it</div><input id="file" class="picker" type="file" accept="audio/mpeg,audio/mp3,audio/mp4,audio/x-m4a,audio/wav,audio/x-wav,audio/aac,.mp3,.m4a,.wav,.aac"><input id="artist" class="meta" placeholder="Artist (optional)"><input id="title" class="meta" placeholder="Title (optional)"><input id="year" class="meta" placeholder="Year (optional)" inputmode="numeric"><div class="buttons"><button id="mic" class="btn secondary">Enable Voice</button><button id="motion" class="btn secondary">Enable Slam</button><button id="start" class="btn" disabled>Start Round</button><button id="reveal" class="btn secondary" disabled>Reveal</button><button id="reset" class="btn secondary">Reset</button><button id="manual" class="btn secondary">Test Slam</button></div><section id="revealBox" class="reveal"><div id="ansTitle" style="font-size:20px;font-weight:1000"></div><div id="ansArtist" class="tiny"></div><div id="ansYear" class="tiny"></div><div class="score"><button data-score="artist">Artist +1</button><button data-score="title">Title +1</button><button data-score="year">Year +1</button></div><div id="roundPts" class="tiny" style="margin-top:6px">Round points: 0</div></section><div class="tiny" style="margin-top:9px">Prototype: phone lies flat on the table. Tap a quadrant if voice misses.</div></main></div><audio id="audio" preload="metadata" playsinline></audio><script>(()=>{const $=id=>document.getElementById(id),zones=[...document.querySelectorAll('.zone')],audio=$('audio'),words={pickle:1,rocket:2,penguin:3,volcano:4},aliases={pickles:'pickle',rockets:'rocket',penguins:'penguin',volcanoes:'volcano'};let rec,listening=false,motion=false,locked=false,claim=false,started=0,slamAt=0,loaded=false,points=new Set(),filename='',objectUrl=null,lastMag=9.8,lastImpact=0,claimTimer=null;const CLAIM_MS=2200,SLAM_DELTA=7.5;function msg(s,h,isErr=false){$('status').textContent=s;$('status').classList.toggle('error',isErr);if(h!==undefined)$('heard').textContent=h}function clearZones(){zones.forEach(z=>z.classList.remove('winner','dim'))}function hideMeta(h=true){['artist','title','year','file'].forEach(id=>$(id).style.display=h?'none':'block')}function endClaim(){claim=false;$('status').classList.remove('claim');if(!locked){msg('NO CLAIM — RESUME?','No battle word heard. Tap Start Round to replay.')}}function slam(source='SLAM'){if(audio.paused||locked||claim)return;slamAt=performance.now();audio.pause();claim=true;$('panel').classList.remove('slam');void $('panel').offsetWidth;$('panel').classList.add('slam');$('status').classList.add('claim');msg('SLAM! WHO GOT IT?','Shout PICKLE · ROCKET · PENGUIN · VOLCANO');navigator.vibrate?.([80,35,80]);clearTimeout(claimTimer);claimTimer=setTimeout(endClaim,CLAIM_MS)}function win(p,word='touch'){if(locked)return;if(!claim&&word!=='touch')return;locked=true;claim=false;clearTimeout(claimTimer);$('status').classList.remove('claim');zones.forEach(z=>{const hit=+z.dataset.p===p;z.classList.toggle('winner',hit);z.classList.toggle('dim',!hit)});const rt=((slamAt||performance.now())-started)/1000;msg('PLAYER '+p+' CLAIMS IT!',word.toUpperCase()+' · slam at '+rt.toFixed(2)+' sec');$('reveal').disabled=false;navigator.vibrate?.([50,30,100])}zones.forEach(z=>z.onpointerdown=()=>{if(claim)win(+z.dataset.p,'touch')});$('manual').onclick=()=>slam('TEST');$('file').onchange=e=>{const f=e.target.files?.[0];loaded=false;$('start').disabled=true;if(!f)return;filename=f.name;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);audio.src=objectUrl;audio.load();msg('Loading '+f.name+'…');const ready=()=>{loaded=true;$('start').disabled=false;msg(filename+' loaded ✓','Enable Voice + Slam, then Start Round.')} ;audio.onloadedmetadata=ready;audio.oncanplay=ready;audio.onerror=()=>msg('Could not load audio','Try another MP3/M4A/WAV/AAC.',true)};$('start').onclick=async()=>{if(!loaded)return;locked=false;claim=false;slamAt=0;clearZones();clearTimeout(claimTimer);points.clear();document.querySelectorAll('[data-score]').forEach(b=>b.classList.remove('active'));$('roundPts').textContent='Round points: 0';$('revealBox').classList.remove('show');$('reveal').disabled=true;hideMeta(true);try{audio.currentTime=0;await audio.play();started=performance.now();msg('SONG PLAYING — SLAM WHEN YOU KNOW IT!','The slam stops the music. Then shout your battle word.')}catch(e){hideMeta(false);msg('Audio did not start',e.message||'Tap Start Round again.',true)}};$('reset').onclick=()=>{audio.pause();locked=false;claim=false;clearTimeout(claimTimer);clearZones();hideMeta(false);$('revealBox').classList.remove('show');$('reveal').disabled=true;msg(loaded?filename+' ready':'Choose a local song to begin.','SLAM stops the song · your battle word claims it')};$('reveal').onclick=()=>{$('revealBox').classList.add('show');$('ansTitle').textContent=$('title').value.trim()||filename.replace(/\.[^.]+$/,'');$('ansArtist').textContent=$('artist').value.trim()||'Artist: not entered';$('ansYear').textContent=$('year').value.trim()?'Year: '+$('year').value.trim():'Year: not entered'};document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>{const k=b.dataset.score;points.has(k)?points.delete(k):points.add(k);b.classList.toggle('active',points.has(k));$('roundPts').textContent='Round points: '+points.size});function detect(t){for(let w of t.toLowerCase().replace(/[^a-z ]/g,' ').split(/\s+/)){w=aliases[w]||w;if(words[w])return{w,p:words[w]}}return null}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-US';rec.onstart=()=>{listening=true;$('mic').textContent='Voice ✓'};rec.onresult=e=>{if(!claim)return;for(let i=e.resultIndex;i<e.results.length;i++)for(let j=0;j<e.results[i].length;j++){const d=detect(e.results[i][j].transcript||'');if(d)return win(d.p,d.w)}};rec.onend=()=>{if(listening)try{rec.start()}catch{}};$('mic').onclick=()=>{if(!listening){listening=true;try{rec.start()}catch(e){msg('Voice failed',e.message,true)}}else{listening=false;rec.stop();$('mic').textContent='Enable Voice'}}}else{$('mic').disabled=true;$('mic').textContent='Voice unavailable'}function motionHit(e){if(!motion||audio.paused||claim||locked)return;const a=e.accelerationIncludingGravity||e.acceleration;if(!a)return;const mag=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2),delta=Math.abs(mag-lastMag),now=performance.now();lastMag=mag;if(delta>SLAM_DELTA&&now-lastImpact>700){lastImpact=now;slam()}}$('motion').onclick=async()=>{try{if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){const p=await DeviceMotionEvent.requestPermission();if(p!=='granted')throw Error('Motion permission not granted')}window.addEventListener('devicemotion',motionHit);motion=true;$('motion').textContent='Slam ✓';msg(loaded?'Slam detection ready':'Slam detection ready — choose a song','Phone should lie flat on the table.')}catch(e){msg('Could not enable slam detection',e.message||'Motion sensors unavailable',true)}}})();</script></body></html>
